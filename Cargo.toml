[package]
name = "max250k"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read project files and count lines, characters, and estimated tokens"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenx-rs = "0.1.0"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
